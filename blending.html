<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blending Orders - B&L Neeley</title>
<style>

:root{
  --bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;
  --accent:#2563eb;--danger:#b91c1c;--red:#fecaca;--yellow:#fef3c7;
  --orange:#fed7aa;--green:#dcfce7;--gray:#f3f4f6
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
button,input,textarea,select{font:inherit}
button{cursor:pointer;font-weight:700}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.secondary{background:#fff}
.error{color:var(--danger);font-size:13px;margin-top:8px}

.wrap{max-width:1600px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a{text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-weight:700;font-size:13px}
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.toolbar div{display:flex;gap:8px;flex-wrap:wrap}input,select,button{border:1px solid var(--border);border-radius:8px;padding:9px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1150px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th{font-size:12px;background:#f9fafb;position:sticky;top:0;z-index:1}
tr.red{background:var(--red)}tr.yellow{background:var(--yellow)}tr.orange{background:var(--orange)}tr.green{background:var(--green)}tr.gray{background:var(--gray);color:var(--muted)}
.items{min-width:560px}.head,.row{display:grid;grid-template-columns:55px 95px minmax(180px,1fr) minmax(150px,190px);gap:8px;align-items:center}.head{font-size:10px;font-weight:800;color:#6b7280;text-transform:uppercase;border-bottom:1px solid rgba(0,0,0,.15);padding-bottom:4px}.row{padding:6px 0;border-bottom:1px dashed rgba(0,0,0,.15)}.row:last-child{border-bottom:0}.lot{width:100%;background:#fff}
.chk{text-align:center}.chk input{width:22px;height:22px}.small{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:28px}
.login{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}.login input,.login button{width:100%}
</style>
</head>
<body>
<div id="loginView" class="login">
<h2>Blending Orders</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required><div style="height:8px"></div><label>Password</label><input id="password" type="password" required><div style="height:12px"></div><button class="primary">Sign In</button><div id="loginError" class="error"></div></form>
</div>

<div id="appView" class="wrap hidden">
<div class="top"><div><h1>Blending Orders</h1><div class="small">Production view — no new-order entry</div></div><div class="links"><a href="index.html">Home</a><a href="mobile.html">Mobile</a><a href="desktop.html">Desktop</a><a href="#" id="logout">Log out</a></div></div>
<div class="panel">
<div class="toolbar"><div><input id="search" placeholder="Search customer, PO, item..."><select id="filter"><option value="active">Active Orders</option><option value="open">Open</option><option value="ready">Ready</option><option value="po_follow">PO to Follow</option><option value="delivered">Delivered</option><option value="all">All Orders</option></select></div><div><button id="refreshBtn">Refresh Now</button></div></div>
<div class="small" id="refreshText"></div>
<div class="tablewrap"><table><thead><tr><th>Ship Date</th><th>Customer</th><th>PO</th><th>Order / Lot Numbers</th><th>Ready</th><th>Delivered</th></tr></thead><tbody id="body"></tbody></table><div id="empty" class="empty hidden">No orders found.</div></div>
</div></div>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function splitItems(t){return String(t||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean)}
function localDateString(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function tomorrowString(){const d=new Date();d.setDate(d.getDate()+1);return localDateString(d)}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function statusClass(o){
  if(o.delivered) return 'gray';
  const t=localDateString(new Date()),tm=tomorrowString();
  if(o.requested_ship_date<t&&!o.ready_to_ship) return 'red';
  if(o.requested_ship_date===t&&!o.ready_to_ship) return 'red';
  if(o.requested_ship_date===t&&o.ready_to_ship) return 'yellow';
  if(o.requested_ship_date===tm&&!o.ready_to_ship) return 'orange';
  if(o.ready_to_ship) return 'green';
  return '';
}
function poLabel(o){
  if(o.po_number) return `PO ${esc(o.po_number)}`;
  if(o.po_status==='to_follow') return 'PO TO FOLLOW';
  if(o.po_status==='no_po_required') return 'NO PO REQUIRED';
  return 'PO NOT SET';
}


function parseOrderLine(raw){
  const text=String(raw||'').trim();
  if(!text) return {qty:'',container:'',item:''};

  let m=text.match(/^\s*(\d+(?:\.\d+)?)\s*(?:[-xX×]\s*)?(\d+(?:\.\d+)?)\s*(g|gal|gallon|gallons|lb|lbs|pound|pounds|oz|ounce|ounces|kg|l|liter|liters|litre|litres)\b\s*(.*)$/i);
  if(m){
    let unit=m[3].toLowerCase();
    if(['g','gal','gallon','gallons'].includes(unit)) unit='gal';
    else if(['lb','lbs','pound','pounds'].includes(unit)) unit='lb';
    else if(['oz','ounce','ounces'].includes(unit)) unit='oz';
    else if(unit==='kg') unit='kg';
    else unit='L';
    return {qty:m[1],container:`${m[2]} ${unit}`,item:(m[4]||'').trim()};
  }

  m=text.match(/^\s*(\d+(?:\.\d+)?)\s*(?:[-xX×]\s*)?(drum|drums|tote|totes|pail|pails|case|cases|bag|bags)\b\s*(.*)$/i);
  if(m){
    const c=m[2].replace(/s$/i,'').toLowerCase();
    return {qty:m[1],container:c.charAt(0).toUpperCase()+c.slice(1),item:(m[3]||'').trim()};
  }

  m=text.match(/^\s*(\d+(?:\.\d+)?)\s*(?:[-xX×]\s*)?(.*)$/);
  if(m && m[2].trim()) return {qty:m[1],container:'',item:m[2].trim()};

  return {qty:'',container:'',item:text};
}

let orders=[],user=null;
async function show(session){user=session?.user||null;$('loginView').classList.toggle('hidden',!!user);$('appView').classList.toggle('hidden',!user);if(user)await load()}
async function load(){const{data,error}=await supabase.from('orders').select('*,order_items(*)').order('delivered',{ascending:true}).order('requested_ship_date',{ascending:true}).order('created_at',{ascending:true});if(error){$('refreshText').textContent=error.message;return}orders=(data||[]).map(o=>({...o,order_items:(o.order_items||[]).sort((a,b)=>(a.position||0)-(b.position||0))}));render();$('refreshText').textContent='Updated '+new Date().toLocaleTimeString()+' • Auto-refreshes every 60 seconds.'}
function visible(){const f=$('filter').value,q=$('search').value.trim().toLowerCase();return orders.filter(o=>{const items=(o.order_items||[]).map(i=>`${i.item_text} ${i.lot_numbers||''}`).join(' '),hay=[o.customer_name,o.po_number,o.order_text,items].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;return f==='all'||(f==='active'&&!o.delivered)||(f==='open'&&!o.ready_to_ship&&!o.delivered)||(f==='ready'&&o.ready_to_ship&&!o.delivered)||(f==='po_follow'&&o.po_status==='to_follow'&&!o.delivered)||(f==='delivered'&&o.delivered)})}
function render(){const data=visible();$('body').innerHTML='';data.forEach(o=>{const tr=document.createElement('tr');tr.className=statusClass(o);const rows=(o.order_items||[]).map(i=>{const p=parseOrderLine(i.item_text);return `<div class="row"><div>${esc(p.qty)}</div><div>${esc(p.container)}</div><div>${esc(p.item)}</div><input class="lot" data-lot="${i.id}" value="${esc(i.lot_numbers||'')}" placeholder="Lot number(s)" ${o.delivered?'disabled':''}></div>`}).join('');tr.innerHTML=`<td>${fmtDate(o.requested_ship_date)}</td><td><strong>${esc(o.customer_name)}</strong></td><td>${poLabel(o)}</td><td class="items"><div class="head"><div>Qty</div><div>Container</div><div>Item</div><div>Lot Number(s)</div></div>${rows}</td><td class="chk"><input type="checkbox" data-ready="${o.id}" ${o.ready_to_ship?'checked':''} ${o.delivered?'disabled':''}></td><td class="chk"><input type="checkbox" data-delivered="${o.id}" ${o.delivered?'checked':''}></td>`;$('body').appendChild(tr)});$('empty').classList.toggle('hidden',!!data.length)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)$('loginError').textContent=error.message};
$('logout').onclick=async e=>{e.preventDefault();await supabase.auth.signOut()};$('search').oninput=render;$('filter').onchange=render;$('refreshBtn').onclick=load;
$('body').addEventListener('change',async e=>{if(e.target.dataset.lot){const{error}=await supabase.from('order_items').update({lot_numbers:e.target.value.trim()||null,updated_by:user.id,updated_by_email:user.email||null}).eq('id',e.target.dataset.lot);if(error)alert(error.message);await load();return}
const id=e.target.dataset.ready||e.target.dataset.delivered;if(!id)return;const o=orders.find(x=>String(x.id)===String(id));let patch={updated_by:user.id,updated_by_email:user.email||null};if(e.target.dataset.ready){if(e.target.checked){const missing=(o.order_items||[]).filter(i=>!String(i.lot_numbers||'').trim()).length;if(missing&&!confirm(`${missing} order item${missing===1?'':'s'} are missing lot numbers.\n\nMark this order Ready to Ship anyway?`)){e.target.checked=false;return}}patch.ready_to_ship=e.target.checked}else{patch.delivered=e.target.checked;if(e.target.checked)patch.ready_to_ship=true}const{error}=await supabase.from('orders').update(patch).eq('id',id);if(error)alert(error.message);await load()});
const{data:{session}}=await supabase.auth.getSession();await show(session);supabase.auth.onAuthStateChange(async(_e,s)=>await show(s));setInterval(async()=>{if(user)await load()},60000);
</script>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deliveries</title><link rel="stylesheet" href="styles.css?v=3.2.2"></head>
<body data-page="deliveries">
<div data-auth="login" class="login"><h2>Deliveries</h2><form class="login-form"><input class="full" name="email" type="email" placeholder="Email" required><div style="height:8px"></div><input class="full" name="password" type="password" placeholder="Password" required><div style="height:12px"></div><button class="primary full">Sign In</button><div class="error"></div></form></div>
<div data-auth="app" class="wrap hidden">
  <div class="top"><div><h1>Deliveries</h1><div class="small">B&amp;L Neeley driver delivery list</div></div>
    <div class="links"><a href="index.html">Home</a><a href="tracker.html">Order Tracker</a><a href="desktop.html">Admin Orders</a><a class="logout" href="#">Log out</a></div>
  </div>
  <div class="driver-note">Green orders are Ready. White orders are still waiting to be completed.</div>
  <div class="panel">
    <div class="delivery-summary">
      <div><input id="deliverySearch" placeholder="Search customer, PO, product...">
        <select id="deliveryFilter"><option value="active">Active Deliveries</option><option value="ready">Ready to Deliver</option><option value="shipped">Delivered / Shipped</option><option value="all">All B&amp;L Deliveries</option></select>
      </div>
      <div style="display:flex;gap:8px;align-items:center"><span class="delivery-count"><span id="deliveryCount">0</span> orders</span><button id="refreshBtn">Refresh</button></div>
    </div>
    <div id="refreshText" class="small"></div>
    <div class="tablewrap"><table class="delivery-table"><thead><tr>
      <th>Requested Delivery</th><th>Customer</th><th>PO</th><th>Order / Lots</th><th>Status</th><th>Delivered / Shipped</th>
    </tr></thead><tbody id="deliveryBody"></tbody></table></div>
  </div>
</div>
<script type="module" src="app.js?v=3.2.2"></script></body></html>

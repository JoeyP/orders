<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Orders</title><link rel="stylesheet" href="styles.css?v=3.2.0"></head>
<body data-page="desktop">
<div data-auth="login" class="login"><h2>Admin Orders</h2><form class="login-form"><input class="full" name="email" type="email" placeholder="Email" required><div style="height:8px"></div><input class="full" name="password" type="password" placeholder="Password" required><div style="height:12px"></div><button class="primary full">Sign In</button><div class="error"></div></form></div>
<div data-auth="app" class="wrap hidden">
  <div class="top"><div><h1>Admin Orders</h1><div class="small">Full order management</div></div>
    <div class="links"><a href="index.html">Home</a><a href="deliveries.html">Deliveries</a><a href="blending.html">Blending</a><a href="new.html">New Order</a><a class="logout" href="#">Log out</a></div>
  </div>
  <div class="panel">
    <div class="desktop-admin-toolbar">
      <div class="desktop-filter-grid">
        <input id="search" placeholder="Search customer, PO, product, lot, delivery method...">
        <select id="filter">
          <option value="active">Active Orders</option><option value="open">Open / Not Ready</option><option value="back">Back Ordered</option><option value="ready">Ready</option><option value="scheduled">Scheduled</option><option value="po_follow">PO to Follow</option><option value="shipped">Shipped</option><option value="all">All Orders</option>
        </select>
        <input id="dateFrom" type="date" aria-label="Requested delivery date from">
        <input id="dateTo" type="date" aria-label="Requested delivery date to">
        <button id="clearFilters" type="button">Clear Filters</button>
      </div>
      <div class="desktop-admin-actions"><button id="exportCsv" type="button" class="primary">Export CSV</button><button id="refreshBtn" type="button">Refresh</button></div>
    </div>
    <div id="refreshText" class="small"></div>
    <div class="tablewrap"><table><thead><tr>
      <th>Requested Delivery</th><th>Customer</th><th>PO</th><th>Delivery Method</th><th>Order / Lots</th><th>Back Ordered</th><th>Ready</th><th>Scheduled</th><th>Pickup Date</th><th>Shipped</th><th>Actions</th>
    </tr></thead><tbody id="body"></tbody></table></div>
  </div>
</div>
<script type="module" src="app.js?v=3.2.0"></script></body></html>

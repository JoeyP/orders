<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B&L Neeley Orders</title>
<style>

:root{
  --bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;
  --accent:#2563eb;--danger:#b91c1c;--red:#fecaca;--yellow:#fef3c7;
  --orange:#fed7aa;--green:#dcfce7;--gray:#f3f4f6
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
button,input,textarea,select{font:inherit}
button{cursor:pointer;font-weight:700}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.secondary{background:#fff}
.error{color:var(--danger);font-size:13px;margin-top:8px}

.wrap{max-width:720px;margin:auto;padding:18px}
.login,.home{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:40px}
h1{margin:0 0 6px;font-size:28px}.sub{color:var(--muted);margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input,button{width:100%;border:1px solid var(--border);border-radius:10px;padding:13px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.menu a{display:flex;align-items:center;justify-content:center;min-height:90px;text-align:center;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:14px;font-weight:800;font-size:18px;padding:14px}
.user{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
@media(max-width:560px){.menu{grid-template-columns:1fr}.menu a{min-height:72px}}
</style>
</head>
<body>
<div class="wrap">
<div id="loginView" class="login">
<h1>B&L Neeley Orders</h1><div class="sub">Sign in to continue.</div>
<form id="loginForm">
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<div style="height:14px"></div><button class="primary">Sign In</button><div id="loginError" class="error"></div>
</form>
</div>

<div id="homeView" class="home hidden">
<div class="user"><span id="userEmail"></span><a href="#" id="logout">Log out</a></div>
<h1>B&L Neeley Orders</h1><div class="sub">Choose where you want to go.</div>
<div class="menu">
<a href="new.html">+ New Order</a>
<a href="mobile.html">Mobile Orders</a>
<a href="blending.html">Blending Orders</a>
<a href="desktop.html">Desktop Orders</a>
</div>
</div>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
async function show(session){const u=session?.user||null;$('loginView').classList.toggle('hidden',!!u);$('homeView').classList.toggle('hidden',!u);if(u)$('userEmail').textContent=u.email||''}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)$('loginError').textContent=error.message};
$('logout').onclick=async e=>{e.preventDefault();await supabase.auth.signOut()};
const{data:{session}}=await supabase.auth.getSession();await show(session);supabase.auth.onAuthStateChange(async(_e,s)=>await show(s));
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Order - B&L Neeley</title>
<style>

:root{
  --bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;
  --accent:#2563eb;--danger:#b91c1c;--red:#fecaca;--yellow:#fef3c7;
  --orange:#fed7aa;--green:#dcfce7;--gray:#f3f4f6
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
button,input,textarea,select{font:inherit}
button{cursor:pointer;font-weight:700}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.secondary{background:#fff}
.error{color:var(--danger);font-size:13px;margin-top:8px}

.wrap{max-width:620px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px;font-size:12px;color:var(--muted)}
.top a{color:inherit}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}
h1{margin:0 0 4px;font-size:27px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
input,textarea,button{width:100%;max-width:100%;min-width:0;border:1px solid var(--border);border-radius:10px;padding:12px;display:block}
input[type="date"]{width:100%;max-width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none}
textarea{min-height:135px;resize:vertical}
.po-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.po-check{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:13px;font-weight:700;background:#fafafa}
.po-check input{width:20px;height:20px;padding:0;margin:0}
.success{color:#166534;font-weight:700;margin-top:10px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.nav a{text-align:center;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<div id="loginView" class="card" style="margin-top:40px">
<h1>B&L Neeley Orders</h1><div class="sub">Sign in to enter an order.</div>
<form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><div style="height:12px"></div><button class="primary">Sign In</button><div id="loginError" class="error"></div></form>
</div>

<div id="appView" class="hidden">
<div class="top"><a href="index.html">Home</a><span><span id="userEmail"></span> · <a href="#" id="logout">Log out</a></span></div>
<div class="nav"><a href="mobile.html">Orders</a><a href="desktop.html">Desktop</a></div>
<div class="card">
<h1>New Order</h1><div class="sub">Enter one item per line. Blending will separate quantity, container size, and item automatically.</div>
<form id="orderForm">
<label>Customer Name</label><input id="customer" required autocomplete="organization">

<label>PO Number</label><input id="po">
<div class="po-options">
<label class="po-check"><input id="poFollow" type="checkbox"> PO to Follow</label>
<label class="po-check"><input id="noPo" type="checkbox"> No PO Required</label>
</div>

<label>Requested Ship Date</label><input id="shipDate" type="date" required>

<label>Order</label><textarea id="orderText" required placeholder="1 - 275g Caustic 30%&#10;1 - 55g CIP5&#10;2 - 53g Perasan A"></textarea>

<div style="height:14px"></div><button class="primary" id="submitBtn">Submit Order</button><div id="msg"></div>
</form>
</div>
</div>
</div>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function splitItems(t){return String(t||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean)}
function localDateString(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function tomorrowString(){const d=new Date();d.setDate(d.getDate()+1);return localDateString(d)}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function statusClass(o){
  if(o.delivered) return 'gray';
  const t=localDateString(new Date()),tm=tomorrowString();
  if(o.requested_ship_date<t&&!o.ready_to_ship) return 'red';
  if(o.requested_ship_date===t&&!o.ready_to_ship) return 'red';
  if(o.requested_ship_date===t&&o.ready_to_ship) return 'yellow';
  if(o.requested_ship_date===tm&&!o.ready_to_ship) return 'orange';
  if(o.ready_to_ship) return 'green';
  return '';
}
function poLabel(o){
  if(o.po_number) return `PO ${esc(o.po_number)}`;
  if(o.po_status==='to_follow') return 'PO TO FOLLOW';
  if(o.po_status==='no_po_required') return 'NO PO REQUIRED';
  return 'PO NOT SET';
}

let user=null;
async function show(session){user=session?.user||null;$('loginView').classList.toggle('hidden',!!user);$('appView').classList.toggle('hidden',!user);if(user)$('userEmail').textContent=user.email||''}
function syncPo(from){
  if(from==='follow'&&$('poFollow').checked){$('noPo').checked=false;$('po').value=''}
  if(from==='no'&&$('noPo').checked){$('poFollow').checked=false;$('po').value=''}
  if(from==='number'&&$('po').value.trim()){$('poFollow').checked=false;$('noPo').checked=false}
}
$('poFollow').onchange=()=>syncPo('follow');$('noPo').onchange=()=>syncPo('no');$('po').oninput=()=>syncPo('number');
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)$('loginError').textContent=error.message};
$('logout').onclick=async e=>{e.preventDefault();await supabase.auth.signOut()};
$('orderForm').onsubmit=async e=>{e.preventDefault();$('msg').className='';$('msg').textContent='';const lines=splitItems($('orderText').value);if(!lines.length){$('msg').className='error';$('msg').textContent='Enter at least one order item.';return}
let poStatus=null,poNumber=$('po').value.trim()||null;
if(poNumber)poStatus='provided';else if($('poFollow').checked)poStatus='to_follow';else if($('noPo').checked)poStatus='no_po_required';
else{$('msg').className='error';$('msg').textContent='Enter a PO number, select PO to Follow, or select No PO Required.';return}
$('submitBtn').disabled=true;$('submitBtn').textContent='Submitting...';
const payload={customer_name:$('customer').value.trim(),order_text:lines.join('\n'),po_number:poNumber,po_status:poStatus,requested_ship_date:$('shipDate').value,ready_to_ship:false,delivered:false,created_by:user.id,created_by_email:user.email||null,updated_by:user.id,updated_by_email:user.email||null};
const{data:order,error}=await supabase.from('orders').insert(payload).select().single();
if(error){$('msg').className='error';$('msg').textContent=error.message;$('submitBtn').disabled=false;$('submitBtn').textContent='Submit Order';return}
const items=lines.map((item_text,position)=>({order_id:order.id,item_text,position}));const{error:itemErr}=await supabase.from('order_items').insert(items);
if(itemErr){$('msg').className='error';$('msg').textContent=itemErr.message}else{$('orderForm').reset();$('msg').className='success';$('msg').innerHTML='Order submitted successfully. <a href="mobile.html">View orders</a>'}
$('submitBtn').disabled=false;$('submitBtn').textContent='Submit Order';
};
const{data:{session}}=await supabase.auth.getSession();await show(session);supabase.auth.onAuthStateChange(async(_e,s)=>await show(s));
</script>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>New Order</title><link rel="stylesheet" href="styles.css?v=3.3.2"></head>
<body data-page="new"><div class="wrap narrow">
<div data-auth="login" class="login"><h2>New Order</h2><form class="login-form"><input class="full" name="email" type="email" placeholder="Email" required><div style="height:8px"></div><input class="full" name="password" type="password" placeholder="Password" required><div style="height:12px"></div><button class="primary full">Sign In</button><div class="error"></div></form></div>
<div data-auth="app" class="hidden">
  <div class="top"><a href="index.html">Home</a><span class="small"><span class="user-email"></span> · <a class="logout" href="#">Log out</a></span></div>
  <div class="card"><h1>New Order</h1><div class="small">Enter one item per line.</div>
    <form id="form">
      <label>Customer Name</label><input id="customer" class="full" required>
      <label>PO Number</label><input id="po" class="full">
      <div class="po-options"><label class="check"><input id="poFollow" type="checkbox"> PO to Follow</label><label class="check"><input id="noPo" type="checkbox"> No PO Required</label></div>
      <label>Requested Delivery Date <span class="small">(optional)</span></label><input id="date" class="full" type="date">

      <label>Delivery Method</label>
      <select id="deliveryMethod" class="full" required>
        <option value="">Select delivery method…</option>
        <option value="bl_neeley">B&amp;L Neeley Delivery</option>
        <option value="lje">LJE Shipping</option>
        <option value="other">Other</option>
      </select>
      <div id="deliveryOtherWrap" class="hidden">
        <label>Other Delivery Method <span class="small">(optional)</span></label>
        <input id="deliveryOther" class="full" placeholder="Customer pickup, UPS, etc.">
      </div>

      <label>Order</label>
      <textarea id="orderText" class="full" rows="6" required placeholder="1 - 275g Caustic 30%&#10;2 - 53g Perasan A"></textarea>
      <label class="check back-check"><input id="backOrdered" type="checkbox"> Back Ordered</label>
      <div style="height:12px"></div>
      <button id="submitOrderBtn" type="submit" class="primary full">Submit Order</button>
      <div id="msg"></div>
    </form>
  </div>
</div></div>
<script type="module" src="app.js?v=3.3.2"></script></body></html>

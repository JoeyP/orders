<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Tracker</title><link rel="stylesheet" href="styles.css?v=3.4.4"></head>
<body data-page="tracker">
<div data-auth="login" class="login"><h2>Order Tracker</h2><form class="login-form"><input class="full" name="email" type="email" placeholder="Email" required><div style="height:8px"></div><input class="full" name="password" type="password" placeholder="Password" required><div style="height:12px"></div><button class="primary full">Sign In</button><div class="error"></div></form></div>
<div data-auth="app" class="wrap hidden">
  <div class="top"><div><h1>Order Tracker</h1><div class="small">Warehouse / fulfillment work queue — Ready orders leave this list automatically.</div></div>
    <div class="links"><a href="index.html">Home</a><a href="deliveries.html">Deliveries</a><a href="blending.html">Blending</a><a href="desktop.html">Admin Orders</a><a class="logout" href="#">Log out</a></div>
  </div>
  <div class="panel">
    <div class="toolbar"><div><input id="search" placeholder="Search..."><select id="filter">
      <option value="active">Active Orders</option>
      <option value="open">Open / Not Ready</option>
      <option value="back">Back Ordered</option>
      <option value="po_follow">PO to Follow</option>
      <option value="all">All Warehouse Orders</option>
    </select></div><button id="refreshBtn">Refresh</button></div>
    <div id="refreshText" class="small"></div>
    <div class="tablewrap"><table><thead><tr>
      <th>Requested Delivery</th>
      <th>Customer</th>
      <th>PO</th>
      <th>Delivery Method</th>
      <th>Order / Lots</th>
      <th>Back Ordered</th>
      <th>Ready</th>
      <th>Shipped</th>
      <th>Actions</th>
    </tr></thead><tbody id="body"></tbody></table></div>
  </div>
</div>
<script type="module" src="app.js?v=3.4.4"></script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Tracker</title><link rel="stylesheet" href="styles.css?v=3.1.8"></head><body data-page="tracker"><div data-auth="login" class="login"><h2>Order Tracker</h2><form class="login-form"><input class="full" name="email" type="email" placeholder="Email" required><div style="height:8px"></div><input class="full" name="password" type="password" placeholder="Password" required><div style="height:12px"></div><button class="primary full">Sign In</button><div class="error"></div></form></div><div data-auth="app" class="wrap hidden"><div class="top"><div><h1>Order Tracker</h1><div class="small">Warehouse / fulfillment view</div></div><div class="links"><a href="index.html">Home</a><a href="blending.html">Blending</a><a href="desktop.html">Desktop</a><a class="logout" href="#">Log out</a></div></div><div class="panel"><div class="toolbar"><div><input id="search" placeholder="Search..."><select id="filter"><option value="active">Active Orders</option><option value="open">Open</option><option value="back">Back Ordered</option><option value="ready">Ready</option><option value="scheduled">Scheduled</option><option value="po_follow">PO to Follow</option><option value="shipped">Shipped</option><option value="all">All Orders</option></select></div><button id="refreshBtn">Refresh</button></div><div id="refreshText" class="small"></div><div class="tablewrap"><table><thead><tr><th>Requested Delivery</th><th>Customer</th><th>PO</th><th>Order / Lots</th><th>Back Ordered</th><th>Ready</th><th>Scheduled</th><th>Pickup Date</th><th>Shipped</th><th>Actions</th></tr></thead><tbody id="body"></tbody></table></div></div></div><script type="module" src="app.js?v=3.1.8"></script>
<div id="editModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>Edit Order</h2>
      <button type="button" id="closeEdit">×</button>
    </div>
    <input type="hidden" id="editId">
    <label>Customer Name</label><input id="editCustomer">
    <label>PO Number</label><input id="editPo">
    <div class="opts">
      <label class="check"><input id="editPoFollow" type="checkbox"> PO to Follow</label>
      <label class="check"><input id="editNoPo" type="checkbox"> No PO Required</label>
    </div>
    <label>Requested Delivery Date</label><input id="editDate" type="date">
    <label>Order</label><textarea id="editOrderText"></textarea>
    <div class="opts">
      <label class="check"><input id="editBack" type="checkbox"> Back Ordered</label>
      <label class="check"><input id="editReady" type="checkbox"> Ready</label>
      <label class="check"><input id="editScheduled" type="checkbox"> Scheduled</label>
      <label class="check"><input id="editShipped" type="checkbox"> Shipped</label>
    </div>
    <label>Scheduled Pickup Date</label><input id="editPickup" type="date">
    <div id="editLots"></div>
    <div id="editError" class="error"></div>
    <div class="modal-actions">
      <button type="button" id="cancelEdit">Cancel</button>
      <button type="button" class="primary" id="saveEdit">Save Changes</button>
      <button type="button" class="danger-btn" id="deleteEdit">Delete Order</button>
    </div>
  </div>
</div>
</body></html>

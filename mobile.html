<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobile Orders - B&L Neeley</title>
<style>

:root{
  --bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;
  --accent:#2563eb;--danger:#b91c1c;--red:#fecaca;--yellow:#fef3c7;
  --orange:#fed7aa;--green:#dcfce7;--gray:#f3f4f6
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
button,input,textarea,select{font:inherit}
button{cursor:pointer;font-weight:700}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.secondary{background:#fff}
.error{color:var(--danger);font-size:13px;margin-top:8px}

.wrap{max-width:720px;margin:auto;padding:12px}
.header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.header h1{margin:0;font-size:25px}.small{font-size:11px;color:var(--muted)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.nav a{text-align:center;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;font-weight:700}
.controls{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
select,button,input,textarea{border:1px solid var(--border);border-radius:10px;padding:10px;max-width:100%;min-width:0}
input[type="date"]{width:100%;max-width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none}
.card{border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:9px;background:#fff}
.red{background:var(--red)}.yellow{background:var(--yellow)}.orange{background:var(--orange)}.green{background:var(--green)}.gray{background:var(--gray);color:#6b7280}
.cardtop{display:flex;justify-content:space-between;gap:10px}.customer{font-size:18px;font-weight:800}.date{font-size:12px;font-weight:800;white-space:nowrap}.po{font-size:11px;color:#4b5563;margin-top:2px;font-weight:700}
.items{margin:8px 0;padding-left:19px}.items li{margin:3px 0}
.pills{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:700}.pill{background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:4px 7px}
.actions{display:flex;gap:8px;margin-top:9px}.actions button{flex:1;background:#fff}
.login{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:40px}.login input{width:100%}
.empty{text-align:center;color:var(--muted);padding:30px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:20}
.modal{width:100%;max-width:720px;max-height:94vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px}
.modal label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}.modal input,.modal textarea{width:100%}.modal textarea{min-height:125px}
.po-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}.po-check{display:flex!important;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:9px;margin:0!important;background:#fafafa}.po-check input{width:20px!important;height:20px}
.lot-row{display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center;margin:6px 0}.lot-row input{padding:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.checkbox{display:flex!important;gap:8px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:9px;margin:0!important}.checkbox input{width:21px!important;height:21px}
</style>
</head>
<body>
<div class="wrap">
<div id="loginView" class="login">
<h1 style="margin-top:0">B&L Neeley Orders</h1><p class="small">Sign in to view orders.</p>
<form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><div style="height:12px"></div><button class="primary" style="width:100%">Sign In</button><div id="loginError" class="error"></div></form>
</div>

<div id="appView" class="hidden">
<div class="header"><div><h1>Orders</h1><div class="small" id="refreshText"></div></div><div class="small" style="text-align:right"><a href="index.html">Home</a><br><span id="userEmail"></span> · <a href="#" id="logout">Log out</a></div></div>
<div class="nav"><a href="new.html">+ New Order</a><a href="blending.html">Blending</a></div>
<div class="controls"><select id="filter"><option value="active">Active Orders</option><option value="open">Open</option><option value="ready">Ready</option><option value="po_follow">PO to Follow</option><option value="delivered">Delivered</option><option value="all">All Orders</option></select><button id="refreshBtn">Refresh</button></div>
<div id="cards"></div><div id="empty" class="empty hidden">No orders found.</div>
</div>
</div>

<div id="modalBack" class="modal-back hidden">
<div class="modal">
<h2 style="margin:0">Edit Order</h2>
<input id="editId" type="hidden">
<label>Customer</label><input id="editCustomer">
<label>PO Number</label><input id="editPo">
<div class="po-options"><label class="po-check"><input id="editPoFollow" type="checkbox"> PO to Follow</label><label class="po-check"><input id="editNoPo" type="checkbox"> No PO Required</label></div>
<label>Requested Ship Date</label><input id="editDate" type="date">
<label>Order — one item per line</label><textarea id="editOrder"></textarea>
<label>Lot Numbers</label><div id="lotEditor"></div>
<div class="checks"><label class="checkbox"><input id="editReady" type="checkbox"> Ready</label><label class="checkbox"><input id="editDelivered" type="checkbox"> Delivered</label></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="cancelEdit">Cancel</button><button id="saveEdit" class="primary">Save Changes</button></div>
<div id="editError" class="error"></div>
</div></div>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from'./config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function splitItems(t){return String(t||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean)}
function localDateString(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function tomorrowString(){const d=new Date();d.setDate(d.getDate()+1);return localDateString(d)}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function statusClass(o){
  if(o.delivered) return 'gray';
  const t=localDateString(new Date()),tm=tomorrowString();
  if(o.requested_ship_date<t&&!o.ready_to_ship) return 'red';
  if(o.requested_ship_date===t&&!o.ready_to_ship) return 'red';
  if(o.requested_ship_date===t&&o.ready_to_ship) return 'yellow';
  if(o.requested_ship_date===tm&&!o.ready_to_ship) return 'orange';
  if(o.ready_to_ship) return 'green';
  return '';
}
function poLabel(o){
  if(o.po_number) return `PO ${esc(o.po_number)}`;
  if(o.po_status==='to_follow') return 'PO TO FOLLOW';
  if(o.po_status==='no_po_required') return 'NO PO REQUIRED';
  return 'PO NOT SET';
}

let orders=[],user=null;
async function show(session){user=session?.user||null;$('loginView').classList.toggle('hidden',!!user);$('appView').classList.toggle('hidden',!user);if(user){$('userEmail').textContent=user.email||'';await load()}}
async function load(){const{data,error}=await supabase.from('orders').select('*,order_items(*)').order('delivered',{ascending:true}).order('requested_ship_date',{ascending:true}).order('created_at',{ascending:true});if(error){$('refreshText').textContent=error.message;return}orders=(data||[]).map(o=>({...o,order_items:(o.order_items||[]).sort((a,b)=>(a.position||0)-(b.position||0))}));render();$('refreshText').textContent='Updated '+new Date().toLocaleTimeString()}
function visible(){const f=$('filter').value;return orders.filter(o=>f==='all'||(f==='active'&&!o.delivered)||(f==='open'&&!o.ready_to_ship&&!o.delivered)||(f==='ready'&&o.ready_to_ship&&!o.delivered)||(f==='po_follow'&&o.po_status==='to_follow'&&!o.delivered)||(f==='delivered'&&o.delivered))}
function render(){const data=visible();$('cards').innerHTML='';data.forEach(o=>{const d=document.createElement('div');d.className='card '+statusClass(o);const items=(o.order_items||[]).map(i=>`<li>${esc(i.item_text)}</li>`).join('');d.innerHTML=`<div class="cardtop"><div><div class="customer">${esc(o.customer_name)}</div><div class="po">${poLabel(o)}</div></div><div class="date">${fmtDate(o.requested_ship_date)}</div></div><ul class="items">${items||`<li>${esc(o.order_text||'')}</li>`}</ul><div class="pills"><span class="pill">Ready: ${o.ready_to_ship?'Yes':'No'}</span><span class="pill">Delivered: ${o.delivered?'Yes':'No'}</span></div><div class="actions"><button data-edit="${o.id}">Edit</button></div>`;$('cards').appendChild(d)});$('empty').classList.toggle('hidden',!!data.length)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)$('loginError').textContent=error.message};
$('logout').onclick=async e=>{e.preventDefault();await supabase.auth.signOut()};$('filter').onchange=render;$('refreshBtn').onclick=load;
$('cards').onclick=e=>{const b=e.target.closest('[data-edit]');if(b)openEdit(b.dataset.edit)};
function syncEditPo(from){if(from==='follow'&&$('editPoFollow').checked){$('editNoPo').checked=false;$('editPo').value=''}if(from==='no'&&$('editNoPo').checked){$('editPoFollow').checked=false;$('editPo').value=''}if(from==='number'&&$('editPo').value.trim()){$('editPoFollow').checked=false;$('editNoPo').checked=false}}
$('editPoFollow').onchange=()=>syncEditPo('follow');$('editNoPo').onchange=()=>syncEditPo('no');$('editPo').oninput=()=>syncEditPo('number');
function openEdit(id){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;$('editId').value=o.id;$('editCustomer').value=o.customer_name;$('editPo').value=o.po_number||'';$('editPoFollow').checked=o.po_status==='to_follow';$('editNoPo').checked=o.po_status==='no_po_required';$('editDate').value=o.requested_ship_date;$('editOrder').value=(o.order_items||[]).map(i=>i.item_text).join('\n')||o.order_text||'';$('editReady').checked=!!o.ready_to_ship;$('editDelivered').checked=!!o.delivered;$('lotEditor').innerHTML=(o.order_items||[]).map(i=>`<div class="lot-row"><div>${esc(i.item_text)}</div><input data-lot-id="${i.id}" value="${esc(i.lot_numbers||'')}" placeholder="Lot number(s)"></div>`).join('');$('editError').textContent='';$('modalBack').classList.remove('hidden')}
$('cancelEdit').onclick=()=>$('modalBack').classList.add('hidden');$('editDelivered').onchange=()=>{if($('editDelivered').checked)$('editReady').checked=true};
$('saveEdit').onclick=async()=>{const id=$('editId').value,o=orders.find(x=>String(x.id)===String(id));if(!o)return;const lines=splitItems($('editOrder').value);if(!lines.length){$('editError').textContent='Enter at least one order item.';return}let poNumber=$('editPo').value.trim()||null,poStatus=null;if(poNumber)poStatus='provided';else if($('editPoFollow').checked)poStatus='to_follow';else if($('editNoPo').checked)poStatus='no_po_required';else{$('editError').textContent='Enter a PO number, select PO to Follow, or select No PO Required.';return}
let ready=$('editReady').checked,delivered=$('editDelivered').checked;if(delivered)ready=true;if(ready&&!delivered){const inputs=[...$('lotEditor').querySelectorAll('[data-lot-id]')],missing=inputs.filter(i=>!i.value.trim()).length;if(missing&&!confirm(`${missing} order item${missing===1?'':'s'} are missing lot numbers.\n\nMark this order Ready to Ship anyway?`))return}
const patch={customer_name:$('editCustomer').value.trim(),po_number:poNumber,po_status:poStatus,requested_ship_date:$('editDate').value,order_text:lines.join('\n'),ready_to_ship:ready,delivered,updated_by:user.id,updated_by_email:user.email||null};
let{error}=await supabase.from('orders').update(patch).eq('id',id);if(error){$('editError').textContent=error.message;return}
const old=o.order_items||[],lotMap=new Map([...$('lotEditor').querySelectorAll('[data-lot-id]')].map(i=>[String(i.dataset.lotId),i.value.trim()||null]));const rebuilt=lines.map((line,pos)=>({order_id:Number(id),item_text:line,lot_numbers:old[pos]?lotMap.get(String(old[pos].id))||null:null,position:pos,updated_by:user.id,updated_by_email:user.email||null}));
({error}=await supabase.from('order_items').delete().eq('order_id',id));if(error){$('editError').textContent=error.message;return}({error}=await supabase.from('order_items').insert(rebuilt));if(error){$('editError').textContent=error.message;return}$('modalBack').classList.add('hidden');await load()};
const{data:{session}}=await supabase.auth.getSession();await show(session);supabase.auth.onAuthStateChange(async(_e,s)=>await show(s));setInterval(async()=>{if(user)await load()},60000);
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Management</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;--accent:#2563eb;--ready:#ecfdf5;--delivered:#f3f4f6;--danger:#b91c1c;--warn:#92400e}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1500px;margin:auto;padding:24px}.panel,.login-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%)}.grid{display:grid;grid-template-columns:1.3fr 2fr 1fr 1fr 1.2fr;gap:12px;align-items:end}label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}input,textarea,button,select{width:100%;font:inherit;border:1px solid var(--border);border-radius:8px;padding:10px}textarea{min-height:42px;resize:vertical}button{cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary{background:#fff}.danger{color:var(--danger)}.toolbar,.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar-left,.toolbar-right,.userbox,.summary,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select{width:auto;min-width:180px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff;min-width:1150px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;vertical-align:top;text-align:left}th{font-size:12px;color:#4b5563;background:#f9fafb}tr.ready:not(.delivered){background:var(--ready)}tr.delivered{background:var(--delivered);color:var(--muted)}td.order-text{min-width:280px;white-space:pre-wrap}.checkcell{text-align:center}.checkcell input{width:20px;height:20px}.actions button,.userbox button{width:auto;padding:7px 9px}.empty{text-align:center;color:var(--muted);padding:30px}.overdue{color:var(--danger);font-weight:700}.today{color:var(--warn);font-weight:700}.statusline,.userbox{font-size:13px;color:var(--muted)}.error{color:var(--danger);margin-top:10px;font-size:13px}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head><body>
<div id="loginView" class="login-wrap"><div class="login-card"><h2>Order Management</h2><p>Sign in with your company account.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><div style="height:12px"></div><label>Password</label><input id="password" type="password" required><div style="height:14px"></div><button class="primary">Sign In</button><div id="loginError" class="error"></div></form></div></div>
<div id="appView" class="wrap hidden"><div class="topbar"><h1>Order Management</h1><div class="userbox"><span id="userEmail"></span><button id="logoutBtn" class="secondary">Log Out</button></div></div>
<div class="panel"><form id="orderForm"><input type="hidden" id="editId"><div class="grid"><div><label>Customer Name</label><input id="customer" required></div><div><label>Order</label><textarea id="orderText" required></textarea></div><div><label>PO Number</label><input id="po"></div><div><label>Requested Ship Date</label><input id="shipDate" type="date" required></div><div><label>Lot Numbers</label><input id="lots"></div></div><div style="display:flex;gap:10px;margin-top:14px"><button id="saveBtn" class="primary">Add Order</button><button type="button" id="cancelEdit" class="secondary hidden">Cancel Edit</button></div><div id="formError" class="error"></div></form></div>
<div class="panel"><div class="toolbar"><div class="toolbar-left"><input id="search" placeholder="Search customer, PO, order, lot..."><select id="statusFilter"><option value="active">Active Orders</option><option value="all">All Orders</option><option value="open">Open</option><option value="ready">Ready to Ship</option><option value="delivered">Delivered</option></select></div><div class="toolbar-right"><button id="refreshBtn" class="secondary">Refresh Now</button><button id="exportBtn" class="secondary">Export CSV</button></div></div><div id="summary" class="summary"></div><div id="refreshStatus" class="statusline">Auto-refreshes every 60 seconds.</div><div class="table-wrap"><table><thead><tr><th>Requested Ship Date</th><th>Customer</th><th>Order</th><th>PO Number</th><th>Lot Numbers</th><th>Ready</th><th>Delivered</th><th>Last Updated By</th><th>Actions</th></tr></thead><tbody id="ordersBody"></tbody></table><div id="emptyState" class="empty hidden">No orders found.</div></div></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let orders=[],currentUser=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const fmt=s=>{if(!s)return'';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
async function loadOrders(show=true){const{data,error}=await supabase.from('orders').select('*').order('delivered',{ascending:true}).order('requested_ship_date',{ascending:true}).order('created_at',{ascending:true});if(error){$('refreshStatus').textContent='Refresh failed: '+error.message;return}orders=data||[];render();if(show)$('refreshStatus').textContent='Updated '+new Date().toLocaleTimeString()+' • Auto-refreshes every 60 seconds.'}
function filtered(){const term=$('search').value.trim().toLowerCase(),status=$('statusFilter').value;return orders.filter(o=>{const h=[o.customer_name,o.order_text,o.po_number,o.lot_numbers].join(' ').toLowerCase();if(term&&!h.includes(term))return false;if(status==='active'&&o.delivered)return false;if(status==='open'&&(o.delivered||o.ready_to_ship))return false;if(status==='ready'&&(!o.ready_to_ship||o.delivered))return false;if(status==='delivered'&&!o.delivered)return false;return true})}
function render(){const body=$('ordersBody'),data=filtered();body.innerHTML='';for(const o of data){const tr=document.createElement('tr');if(o.ready_to_ship)tr.classList.add('ready');if(o.delivered)tr.classList.add('delivered');const t=localDate(new Date()),cls=!o.delivered?(o.requested_ship_date<t?'overdue':o.requested_ship_date===t?'today':''):'';tr.innerHTML=`<td class="${cls}">${fmt(o.requested_ship_date)}</td><td>${esc(o.customer_name)}</td><td class="order-text">${esc(o.order_text)}</td><td>${esc(o.po_number)}</td><td>${esc(o.lot_numbers)}</td><td class="checkcell"><input type="checkbox" ${o.ready_to_ship?'checked':''} data-action="ready" data-id="${o.id}"></td><td class="checkcell"><input type="checkbox" ${o.delivered?'checked':''} data-action="delivered" data-id="${o.id}"></td><td>${esc(o.updated_by_email)}</td><td><div class="actions"><button class="secondary" data-action="edit" data-id="${o.id}">Edit</button><button class="secondary danger" data-action="delete" data-id="${o.id}">Delete</button></div></td>`;body.appendChild(tr)}$('emptyState').classList.toggle('hidden',!!data.length);$('summary').innerHTML=`<span><strong>${orders.length}</strong> total</span><span><strong>${orders.filter(o=>!o.ready_to_ship&&!o.delivered).length}</strong> open</span><span><strong>${orders.filter(o=>o.ready_to_ship&&!o.delivered).length}</strong> ready</span><span><strong>${orders.filter(o=>o.delivered).length}</strong> delivered</span>`}
async function showSession(s){currentUser=s?.user||null;if(currentUser){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userEmail').textContent=currentUser.email||'';await loadOrders(false)}else{$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');orders=[]}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)$('loginError').textContent=error.message});$('logoutBtn').onclick=()=>supabase.auth.signOut();
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('editId').value,p={customer_name:$('customer').value.trim(),order_text:$('orderText').value.trim(),po_number:$('po').value.trim()||null,requested_ship_date:$('shipDate').value,lot_numbers:$('lots').value.trim()||null,updated_by:currentUser.id,updated_by_email:currentUser.email||null};let error;if(id){({error}=await supabase.from('orders').update(p).eq('id',id))}else{p.created_by=currentUser.id;p.created_by_email=currentUser.email||null;({error}=await supabase.from('orders').insert(p))}if(error){$('formError').textContent=error.message;return}resetForm();await loadOrders()});
$('ordersBody').addEventListener('change',async e=>{const a=e.target.dataset.action,id=e.target.dataset.id;if(!a)return;const patch={updated_by:currentUser.id,updated_by_email:currentUser.email||null};if(a==='ready')patch.ready_to_ship=e.target.checked;if(a==='delivered'){patch.delivered=e.target.checked;if(e.target.checked)patch.ready_to_ship=true}const{error}=await supabase.from('orders').update(patch).eq('id',id);if(error)alert(error.message);await loadOrders(false)});
$('ordersBody').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const o=orders.find(x=>String(x.id)===String(b.dataset.id));if(!o)return;if(b.dataset.action==='edit'){$('editId').value=o.id;$('customer').value=o.customer_name;$('orderText').value=o.order_text;$('po').value=o.po_number||'';$('shipDate').value=o.requested_ship_date;$('lots').value=o.lot_numbers||'';$('saveBtn').textContent='Save Changes';$('cancelEdit').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}if(b.dataset.action==='delete'&&confirm(`Delete order for ${o.customer_name}?`)){const{error}=await supabase.from('orders').delete().eq('id',o.id);if(error)alert(error.message);await loadOrders()}});
function resetForm(){$('orderForm').reset();$('editId').value='';$('saveBtn').textContent='Add Order';$('cancelEdit').classList.add('hidden');$('formError').textContent=''}$('cancelEdit').onclick=resetForm;$('search').oninput=render;$('statusFilter').onchange=render;$('refreshBtn').onclick=()=>loadOrders();$('exportBtn').onclick=()=>{const rows=[['Requested Ship Date','Customer','Order','PO Number','Lot Numbers','Ready to Ship','Delivered','Last Updated By'],...filtered().map(o=>[o.requested_ship_date,o.customer_name,o.order_text,o.po_number,o.lot_numbers,o.ready_to_ship?'Yes':'No',o.delivered?'Yes':'No',o.updated_by_email||''])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='orders.csv';a.click();URL.revokeObjectURL(u)};
const{data:{session}}=await supabase.auth.getSession();await showSession(session);supabase.auth.onAuthStateChange((_e,s)=>showSession(s));setInterval(()=>{if(currentUser)loadOrders()},60000);
</script></body></html>
